name: Control de evidencia

# Una vez por semana abre cada fuente citada y comprueba que la frase que
# sostiene cada afirmación siga ahí. Sin modelos. Solo escribe evidencia.json.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"          # lunes 11:17 UTC
  push:
    branches: [main]
    paths:
      - "evidencia/**"
      - ".github/workflows/evidencia.yml"

permissions:
  contents: write

concurrency:
  group: evidencia
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r evidencia/requirements.txt pytest
      - run: python -m pytest -q tests/test_evidencia.py
      - name: Comprobar las fuentes
        run: |
          set -o pipefail
          python -m evidencia.control | tee /tmp/control.txt
          { echo '### Control de evidencia'; echo '```'; cat /tmp/control.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/evidencia.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "evidencia: control $(date -u +%F)"
          git pull --rebase origin main
          git push
