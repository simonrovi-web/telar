[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telar-motor"
version = "0.1.0"
description = "Motor de investigación documental en español: extracción de entidades, grafo de relaciones y agente de búsqueda con citas verificadas, sobre Qwen 3 local vía Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40,<3",
  "pydantic>=2.6,<3",
  "sqlite-vec>=0.1.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
telar = "telar_motor.__main__:main"

[tool.setuptools]
packages = ["telar_motor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
